name: FarmConnect
options:
  minimumXcodeGenVersion: 2.38.0
targets:
  FarmConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FarmConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persephonesbasket.farmconnect
        PRODUCT_NAME: FarmConnect
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        # Literal, as it was before. $(CI_BUILD_NUMBER) does not expand during the
        # archive, which leaves CFBundleVersion empty and fails "Prepare Build for
        # App Store Connect". Bump this by hand for each App Store upload.
        CURRENT_PROJECT_VERSION: "14"
        # Required for App Store Connect: identifies the signing team. Xcode wrote this
        # into the project directly, so it was lost the first time the project was
        # regenerated from this spec.
        DEVELOPMENT_TEAM: NLMFF528Q4
        CODE_SIGN_ENTITLEMENTS: FarmConnect/FarmConnect.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Persephone's Basket"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: We use location to show local farm posts on the map.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: We use photos to upload images in posts.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: We may save generated media to your photo library.
        INFOPLIST_KEY_NSCameraUsageDescription: We use the camera so you can take and upload photos for posts.
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
# The shipping project has only ever contained the app target. A unit-test target was
# declared here but had never been generated into the project that Xcode Cloud builds,
# so adding one now would change what the workflow archives. Left out deliberately;
# the files under FarmConnectTests/ stay in the repo.
schemes:
  FarmConnect:
    build:
      targets:
        FarmConnect: all
